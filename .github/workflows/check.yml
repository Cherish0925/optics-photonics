name: Build and check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: git diff --exit-code -- docs data/resources.en.json data/resources.zh.json data/manifest.json llms.txt llms-full.txt
  connections:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      OPTICS_SCIENCE_TESTS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . build mcp -r requirements-science.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/install_iop_check.py
      - run: python scripts/check_iop_connection.py
      - run: python -m build
      - name: Install wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/optics-wheel"
          if [ "$RUNNER_OS" = Windows ]; then PY="$RUNNER_TEMP/optics-wheel/Scripts/python.exe"; else PY="$RUNNER_TEMP/optics-wheel/bin/python"; fi
          "$PY" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$PY" -m optics_photonics search tmm
          "$PY" -m optics_photonics connect agentic-research-os --output "$RUNNER_TEMP/optics-plugin"
          "$PY" "$RUNNER_TEMP/optics-plugin/server.py" info tmm
  python-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [catalogue, connections, python-minimum]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/package_release.py
      - name: Publish versioned packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c "import sys;sys.path.insert(0,'src');from optics_photonics import __version__;print(__version__)")
          TAG="optics-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version already published; retain its original packages."
          else
            gh release create "$TAG" dist/*.whl dist/*.tar.gz dist/*.zip --target "$GITHUB_SHA" --title "Optics & Photonics $VERSION" --notes-file docs/RELEASE.md
          fi
