name: Build and check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: python scripts/package_marketplace.py --check
      - run: git diff --exit-code -- docs data/resources.en.json data/resources.zh.json data/manifest.json llms.txt llms-full.txt
  connections:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      OPTICS_SCIENCE_TESTS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install -e ".[rl]" build mcp -r requirements-science.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: clients/typescript
      - run: npm test
        working-directory: clients/typescript
      - run: python scripts/check_standalone_connection.py
      - run: python -m build
      - name: Install wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/optics-wheel"
          if [ "$RUNNER_OS" = Windows ]; then PY="$RUNNER_TEMP/optics-wheel/Scripts/python.exe"; else PY="$RUNNER_TEMP/optics-wheel/bin/python"; fi
          "$PY" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$PY" -m optics_photonics search tmm
          "$PY" -m optics_photonics connect agentic-research-os --output "$RUNNER_TEMP/optics-plugin"
          "$PY" "$RUNNER_TEMP/optics-plugin/server.py" info tmm
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, windows-2022, windows-11-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --manifest-path native/executor/Cargo.toml
      - name: Include platform executor
        shell: python
        run: |
          import os, platform, shutil
          from pathlib import Path
          system = platform.system().lower()
          machine = platform.machine().lower()
          arch = {'amd64':'x86_64','aarch64':'arm64'}.get(machine,machine)
          name = 'optics-execd.exe' if system == 'windows' else 'optics-execd'
          target = Path('src/optics_photonics/bin') / (system+'-'+arch)
          target.mkdir(parents=True)
          shutil.copy2(Path('native/executor/target/release')/name, target/name)
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('PYTHONPATH='+str(Path('src').resolve())+'\n')
      - run: python -m unittest discover -s tests -p test_jobs.py -v
      - run: python -m unittest discover -s tests -p test_shared_resources.py -v
      - run: python -m unittest discover -s tests -p test_executor.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: optics-native-${{ matrix.os }}
          path: src/optics_photonics/bin/
  python-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [catalogue, connections, python-minimum, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: optics-native-*
          merge-multiple: true
          path: src/optics_photonics/bin
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build && npm pack --pack-destination ../../dist
        working-directory: clients/typescript
      - run: python scripts/package_release.py
      - name: Publish versioned packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c "import sys;sys.path.insert(0,'src');from optics_photonics import __version__;print(__version__)")
          TAG="optics-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version already published; retain its original packages."
          else
            gh release create "$TAG" dist/*.whl dist/*.tar.gz dist/*.zip dist/*.tgz --target "$GITHUB_SHA" --title "Optics & Photonics $VERSION" --notes-file docs/RELEASE.md
          fi
