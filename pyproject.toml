[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optics-photonics"
version = "0.5.1"
description = "Independent optical research environment: solvers, native programs, agent tools and episode sampling"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Optics & Photonics"}]
dependencies = []

[project.optional-dependencies]
rl = ["gymnasium>=1.0,<2"]

[project.scripts]
optics-photonics = "optics_photonics.cli:main"

[project.urls]
Repository = "https://github.com/Cherish0925/Optics-Photonics-AI-Lab"

[tool.setuptools.packages.find]
where = ["src"]
include = ["optics_photonics*"]
